<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto y Reclutamiento | DX Esports</title>

    <style>
        :root {
            --bg: #0a0a0f;
            --primary: #8b5cf6;
            --primary-light: #a855f7;
            --text: #f3f4f6;
            --text-secondary: #9ca3af;
            --card: rgba(255,255,255,0.05);
            --border: rgba(255,255,255,0.08);
            --primary-glow: rgba(168, 85, 247, 0.4);
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Segoe UI',sans-serif;
            background:linear-gradient(180deg,#050507,#0f172a);
            color:var(--text);
            min-height:100vh;
        }

        .navbar{
            background:#0a0a0f;
            border-bottom:1px solid var(--border);
            padding:1rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(15px);
        }

        .nav-container{
            width:min(1200px,90%);
            margin:auto;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .logo{
            display:flex;
            align-items:center;
            gap:1rem;
        }

        .logo img{
            width:50px;
            filter: drop-shadow(0 0 8px var(--primary-glow));
        }

        .logo h2 span {
            color: var(--primary-light);
            text-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }

        .nav-links{
            display:flex;
            gap:1rem;
        }

        .nav-links a{
            color:var(--text-secondary);
            text-decoration:none;
            padding:.7rem 1rem;
            border-radius:999px;
            transition:.3s;
        }

        .nav-links a:hover{
            background: rgba(139, 92, 246, 0.1);
            color: var(--primary-light);
            text-shadow: 0 0 10px var(--primary-glow);
        }

        .hero{
            text-align:center;
            padding:5rem 1rem 2rem;
        }

        .hero h1{
            font-size:3rem;
            margin-bottom:1rem;
        }

        .hero span{
            color:var(--primary-light);
            text-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }

        .hero p{
            color:var(--text-secondary);
        }

        .contact-box{
            width:min(700px,90%);
            margin:2rem auto;
            background:var(--card);
            border:1px solid var(--border);
            border-radius:24px;
            padding:3rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 40px rgba(139, 92, 246, 0.05);
        }

        .form-group{
            display:flex;
            flex-direction:column;
            margin-bottom:1.5rem;
        }

        label{
            margin-bottom:.5rem;
            font-weight:600;
            color: var(--text-secondary);
        }

        input,
        select,
        textarea{
            padding:1rem;
            border-radius:12px;
            border:1px solid var(--border);
            background:rgba(255,255,255,0.03);
            color:white;
            font-size:1rem;
            transition: 0.3s;
        }

        /* Estilo para las opciones del select */
        select option {
            background: #0f172a;
            color: white;
        }

        input:focus,
        select:focus,
        textarea:focus{
            outline:none;
            border-color:var(--primary-light);
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.2);
        }

        textarea{
            resize:vertical;
            min-height:120px;
        }

        .btn{
            width: 100%;
            background:linear-gradient(135deg,var(--primary),var(--primary-light));
            color:white;
            border:none;
            padding:1rem 1.5rem;
            border-radius:12px;
            cursor:pointer;
            font-weight:bold;
            transition:.3s;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
        }

        .btn:hover{
            transform:translateY(-3px);
            box-shadow: 0 10px 20px var(--primary-glow);
        }

        .socials{
            width:min(700px,90%);
            margin:2rem auto;
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
            gap:1rem;
        }

        .social-card{
            background:var(--card);
            border:1px solid var(--border);
            padding:1.5rem;
            border-radius:20px;
            text-align:center;
            transition: 0.3s;
        }

        .social-card:hover {
            border-color: var(--primary-light);
            transform: translateY(-5px);
        }

        .social-card h3{
            color:var(--primary-light);
            margin-bottom:.5rem;
        }

        .social-card p{
            color:var(--text-secondary);
        }

        footer{
            margin-top:4rem;
            text-align:center;
            padding:2rem;
            border-top:1px solid var(--border);
            color:var(--text-secondary);
            background: rgba(5, 5, 8, 0.8);
        }

        @media(max-width:768px){
            .nav-container{
                flex-direction:column;
                gap:1rem;
            }

            .nav-links{
                flex-wrap:wrap;
                justify-content:center;
            }

            .contact-box{
                padding:2rem;
            }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <div class="logo">
            <img src="logo2.png" alt="DX Logo">
            <h2>DX <span>Esports</span></h2>
        </div>
        <div class="nav-links">
            <a href="index.html">Inicio</a>
            <a href="equipo.html">Equipo</a>
            <a href="contacto.html">Contacto</a>
        </div>
    </div>
</nav>

<section class="hero">
    <h1>Contacto <span>DX</span></h1>
    <p>¿Quieres unirte a nuestras filas o realizar una consulta? Envía tu formulario.</p>
</section>

<section class="contact-box">
    <!-- El atributo data-netlify="true" le indica a Netlify que procese este formulario automáticamente -->
    <form name="reclutamiento-dx" method="POST" data-netlify="true">
        
        <div class="form-group">
            <label for="nombre">Nombre o Nickname</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan 'ProPlayer' Pérez" required>
        </div>

        <div class="form-group">
            <label for="correo">Correo Electrónico</label>
            <input type="email" id="correo" name="email" placeholder="tu@email.com" required>
        </div>

        <div class="form-group">
            <label for="juego">División a la que aspiras</label>
            <select id="juego" name="juego" required>
                <option value="" disabled selected>Selecciona un juego...</option>
                <option value="Free Fire">Free Fire</option>
                <option value="Call of Duty Mobile">Call of Duty Mobile</option>
                <option value="FC Mobile">FC Mobile</option>
                <option value="Counter Strike 2">Counter Strike 2</option>
                <option value="Consulta General">Solo consulta general</option>
            </select>
        </div>

        <div class="form-group">
            <label for="game-id">ID del Juego / Rango Actual</label>
            <input type="text" id="game-id" name="game-id" placeholder="Ej: ID: 55432123 / Rango: Heroico">
        </div>

        <div class="form-group">
            <label for="mensaje">Mensaje o Motivación</label>
            <textarea id="mensaje" name="mensaje" placeholder="Cuéntanos por qué quieres ser parte de DX Esports..." required></textarea>
        </div>

        <button class="btn" type="submit">
            Enviar Postulación
        </button>

    </form>
</section>

<section class="socials">
    <div class="social-card">
        <h3>Discord</h3>
        <p>discord.gg/dx</p>
    </div>
    <div class="social-card">
        <h3>Instagram</h3>
        <p>@dx.esports</p>
    </div>
    <div class="social-card">
        <h3>Email</h3>
        <p>contacto@dxesports.com</p>
    </div>
</section>

<footer>
    DX (Degeneration X) © 2027 - Todos los derechos reservados.
</footer>

</body>
</html>
